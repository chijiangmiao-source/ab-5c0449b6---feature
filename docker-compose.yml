name: relay-drill

services:
  app:
    build: .
    image: relay-drill-app
    environment:
      PORT: "8000"
      STEP_DELAY: "0.25"
    ports:
      # 宿主端口可通过 HOST_PORT 环境变量配置（默认 8080）
      - "${HOST_PORT:-8080}:8000"
    volumes:
      - relay-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8000')+'/healthz',timeout=3).read()"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  verify:
    build: .
    image: relay-drill-app
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_HOST: app
      APP_PORT: "8000"
    command: ["python", "-m", "verify"]
    restart: "no"

volumes:
  relay-data:
